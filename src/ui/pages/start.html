<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <title>नया टैब</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #1b1d23 0%, #23283a 100%);
      color: #e8eaf0;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 32px 24px;
    }
    h1 { font-size: 40px; font-weight: 600; letter-spacing: 1px; }
    h1 span { color: #6db3ff; }
    form { width: 100%; max-width: 560px; }
    input {
      width: 100%;
      height: 52px;
      padding: 0 24px;
      border: none;
      border-radius: 26px;
      font-size: 16px;
      background: #ffffff;
      color: #1b1d23;
      outline: none;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
    #dial {
      display: grid;
      grid-template-columns: repeat(4, 120px);
      gap: 14px;
      justify-content: center;
    }
    #dial a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 88px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
      color: #cfd3dc;
      text-decoration: none;
      font-size: 12px;
      overflow: hidden;
      padding: 8px;
    }
    #dial a:hover { background: rgba(255, 255, 255, 0.14); }
    #dial .letter {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #3d5a94;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #dial .host {
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .note { font-size: 13px; color: #8a90a0; }
    @media (max-width: 640px) { #dial { grid-template-columns: repeat(2, 120px); } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tez<span>Browser</span></h1>
    <form id="searchform" action="https://duckduckgo.com/" method="get">
      <input name="q" type="text" placeholder="वेब पर खोजें…" autofocus autocomplete="off" />
    </form>
    <div id="dial"></div>
    <p class="note">🛡 ऐड और ट्रैकर अपने-आप ब्लॉक — पेज तेज़ लोड होते हैं</p>
  </div>
  <script>
    (async () => {
      try {
        const search = await window.tez.list('search');
        if (search && search.action) {
          document.getElementById('searchform').action = search.action;
          document.querySelector('#searchform input').placeholder =
            search.name + ' पर खोजें…';
        }
      } catch (e) {}
      try {
        const sites = (await window.tez.list('topsites')) || [];
        const dial = document.getElementById('dial');
        const fallback = [
          { url: 'https://www.wikipedia.org', host: 'wikipedia.org' },
          { url: 'https://www.youtube.com', host: 'youtube.com' },
          { url: 'https://news.google.com', host: 'news.google.com' },
          { url: 'https://github.com', host: 'github.com' },
        ];
        for (const s of sites.length ? sites : fallback) {
          const a = document.createElement('a');
          a.href = s.url;
          const letter = document.createElement('div');
          letter.className = 'letter';
          letter.textContent = (s.host[0] || '?').toUpperCase();
          const host = document.createElement('div');
          host.className = 'host';
          host.textContent = s.host;
          a.append(letter, host);
          dial.appendChild(a);
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
