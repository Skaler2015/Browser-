<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <title>TezBrowser</title>
  <style>
    :root {
      --strip: #14161a;
      --bar: #2f333d;
      --tab: #23262e;
      --tab-active: #2f333d;
      --text: #e8eaf0;
      --dim: #9aa0ad;
      --hover: #3d424e;
      --input: #1b1d23;
      --accent: #4d7fd6;
    }
    [data-theme="light"] {
      --strip: #d6d9e0;
      --bar: #eef0f4;
      --tab: #e0e3ea;
      --tab-active: #ffffff;
      --text: #23262e;
      --dim: #5b6070;
      --hover: #d5d9e2;
      --input: #ffffff;
      --accent: #3466c2;
    }
    [data-theme="blue"] {
      --strip: #0d1526;
      --bar: #1b2c4f;
      --tab: #152140;
      --tab-active: #1b2c4f;
      --text: #e8eef8;
      --dim: #93a4c4;
      --hover: #27407a;
      --input: #0d1526;
      --accent: #5b9dff;
    }
    [data-theme="green"] {
      --strip: #0d1a12;
      --bar: #1c3a26;
      --tab: #14291b;
      --tab-active: #1c3a26;
      --text: #e8f5ec;
      --dim: #93c4a2;
      --hover: #275435;
      --input: #0d1a12;
      --accent: #4fbf72;
    }
    [data-theme="purple"] {
      --strip: #170d26;
      --bar: #32204f;
      --tab: #241640;
      --tab-active: #32204f;
      --text: #f0e8f8;
      --dim: #ab93c4;
      --hover: #46307a;
      --input: #170d26;
      --accent: #a05bff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--strip);
      color: var(--text);
      overflow: hidden;
      user-select: none;
    }

    /* ---- tab strip ---- */
    #tabstrip {
      display: flex;
      align-items: flex-end;
      height: 38px;
      padding: 6px 8px 0 8px;
      gap: 4px;
      background: var(--strip);
      overflow-x: auto;
    }
    #tabstrip::-webkit-scrollbar { display: none; }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 120px;
      max-width: 220px;
      height: 32px;
      padding: 0 10px;
      background: var(--tab);
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      flex-shrink: 1;
      overflow: hidden;
      border-top: 3px solid transparent;
    }
    .tab.active { background: var(--tab-active); }
    .tab.private { background: #2c2440; }
    .tab.private.active { background: #3a2f55; }
    .tab.identity { background: #143036; }
    .tab.identity.active { background: #1c454e; }
    .tab .idbadge {
      flex-shrink: 0;
      font-size: 9px;
      background: #1c8a9e;
      color: #fff;
      border-radius: 8px;
      padding: 1px 5px;
    }
    .tab.asleep .title { opacity: 0.45; }
    .tab.split { outline: 1px dashed var(--accent); outline-offset: -2px; }
    .tab.c-red { border-top-color: #e5655f; }
    .tab.c-yellow { border-top-color: #e8c94f; }
    .tab.c-green { border-top-color: #58c274; }
    .tab.c-blue { border-top-color: #5b9dff; }
    .tab.c-purple { border-top-color: #a05bff; }
    .tab.pinned {
      min-width: 40px;
      max-width: 40px;
      justify-content: center;
      padding: 0;
    }
    .tab.dragover { outline: 2px solid var(--accent); outline-offset: -2px; }
    .tab img.fav {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 3px;
    }
    .tab .title {
      flex: 1;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab .close, .tab .sound {
      width: 18px; height: 18px;
      line-height: 18px;
      text-align: center;
      border-radius: 50%;
      font-size: 11px;
      color: var(--dim);
      flex-shrink: 0;
    }
    .tab .close:hover, .tab .sound:hover { background: var(--hover); color: var(--text); }
    .tab .spinner {
      width: 10px; height: 10px;
      border: 2px solid var(--hover);
      border-top-color: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #newtab {
      width: 28px; height: 28px;
      margin-bottom: 2px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--dim);
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    #newtab:hover { background: var(--tab-active); color: var(--text); }

    /* ---- navigation bar ---- */
    #navbar {
      display: flex;
      align-items: center;
      height: 46px;
      padding: 0 10px;
      gap: 5px;
      background: var(--bar);
    }
    #navbar button {
      width: 32px; height: 32px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
      flex-shrink: 0;
    }
    #navbar button:hover:not(:disabled) { background: var(--hover); }
    #navbar button:disabled { color: var(--dim); opacity: 0.5; cursor: default; }
    #addresswrap { flex: 1; position: relative; min-width: 120px; }
    #address {
      width: 100%;
      height: 32px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 16px;
      background: var(--input);
      color: var(--text);
      font-size: 13px;
      outline: none;
      user-select: text;
    }
    #address:focus { border-color: var(--accent); }
    #star.active { color: #ffd764; }
    #keepalive.active { background: #263524; color: #8fd694; }
    #shield {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 32px;
      padding: 0 10px;
      border: none;
      border-radius: 14px;
      background: #263524;
      color: #8fd694;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }
    #shield.off { background: #3a2d2d; color: #d69a8f; }
    #downloads { position: relative; }
    #downloads.busy::after {
      content: "";
      position: absolute;
      top: 4px; right: 4px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* ---- address bar suggestions ---- */
    #suggest {
      display: none;
      position: absolute;
      top: 36px;
      left: 0;
      right: 0;
      background: var(--bar);
      border: 1px solid var(--hover);
      border-radius: 10px;
      overflow: hidden;
      z-index: 10;
    }
    #suggest.open { display: block; }
    .sug {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      font-size: 12px;
      cursor: pointer;
    }
    .sug.sel, .sug:hover { background: var(--hover); }
    .sug .ic { flex-shrink: 0; }
    .sug .st {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 45%;
    }
    .sug .su {
      color: var(--dim);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* ---- find bar ---- */
    #findbar {
      display: none;
      align-items: center;
      height: 34px;
      padding: 0 10px;
      gap: 6px;
      background: var(--bar);
      border-top: 1px solid var(--hover);
    }
    #findbar.open { display: flex; }
    #findtext {
      width: 260px;
      height: 26px;
      padding: 0 10px;
      border: 1px solid var(--hover);
      border-radius: 6px;
      background: var(--input);
      color: var(--text);
      font-size: 12px;
      outline: none;
      user-select: text;
    }
    #findcount { font-size: 12px; color: var(--dim); }
    #findbar button {
      width: 26px; height: 26px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    #findbar button:hover { background: var(--hover); }

    #mic.listening { background: #6e3030; color: #fff; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }

    /* ---- upload sidebar (custom file picker) ---- */
    #sidebar {
      display: none;
      position: fixed;
      right: 0;
      width: 340px;
      background: var(--bar);
      border-left: 1px solid var(--hover);
      flex-direction: column;
      z-index: 20;
    }
    #sidebar.open { display: flex; }
    #sb-head {
      padding: 12px 14px 10px 14px;
      border-bottom: 1px solid var(--hover);
    }
    #sb-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    #sb-hint { font-size: 11px; color: var(--dim); }
    #sb-path {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      font-size: 12px;
      border-bottom: 1px solid var(--hover);
    }
    #sb-up {
      border: none; background: var(--hover); color: var(--text);
      width: 30px; height: 26px; border-radius: 6px; cursor: pointer; flex-shrink: 0;
    }
    #sb-up:hover { background: var(--accent); color: #fff; }
    #sb-up:disabled { opacity: 0.4; cursor: default; }
    #sb-cwd { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; direction: rtl; text-align: left; }
    #sb-star {
      border: none; background: transparent; color: #ffd764;
      font-size: 16px; cursor: pointer; flex-shrink: 0;
    }
    #sb-quick, #sb-fav { padding: 6px 10px; border-bottom: 1px solid var(--hover); }
    #sb-quick .lbl, #sb-fav .lbl { font-size: 10px; color: var(--dim); margin: 2px 4px; text-transform: uppercase; }
    .chiprow { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      font-size: 11px; background: var(--input); color: var(--text);
      border-radius: 12px; padding: 4px 10px; cursor: pointer;
      display: flex; align-items: center; gap: 5px; max-width: 100%;
    }
    .chip:hover { background: var(--hover); }
    .chip span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 120px; }
    .chip .x { color: var(--dim); }
    .chip .x:hover { color: #ff9d8f; }
    #sb-list { flex: 1; overflow-y: auto; }
    .fitem {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 14px; font-size: 13px; cursor: pointer;
    }
    .fitem:hover { background: var(--hover); }
    .fitem.sel { background: rgba(77,127,214,0.28); }
    .fitem .ic { flex-shrink: 0; width: 18px; text-align: center; }
    .fitem .nm { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .fitem .sz { font-size: 10px; color: var(--dim); flex-shrink: 0; }
    #sb-empty { padding: 30px 14px; text-align: center; color: var(--dim); font-size: 12px; }
    #sb-foot {
      display: flex; gap: 8px; padding: 12px 14px;
      border-top: 1px solid var(--hover);
    }
    #sb-foot button {
      flex: 1; height: 38px; border: none; border-radius: 8px;
      font-size: 13px; cursor: pointer;
    }
    #sb-choose { background: var(--accent); color: #fff; }
    #sb-choose:disabled { opacity: 0.45; cursor: default; }
    #sb-cancel { background: var(--hover); color: var(--text); }
    #sb-count { font-size: 11px; color: var(--dim); padding: 0 14px 8px 14px; }

    /* ---- simple mode: bigger everything, calmer ---- */
    body.simple #navbar { height: 60px; gap: 8px; }
    body.simple #navbar button { width: 44px; height: 44px; font-size: 20px; }
    body.simple #address { height: 44px; font-size: 17px; border-radius: 22px; }
    body.simple .tab { height: 40px; min-width: 150px; }
    body.simple .tab .title { font-size: 14px; }
    body.simple #tabstrip { height: 46px; }
    body.simple #shield { height: 44px; font-size: 15px; }
  </style>
</head>
<body>
  <div id="tabstrip"></div>
  <div id="navbar">
    <button id="back" title="पीछे">&#8592;</button>
    <button id="forward" title="आगे">&#8594;</button>
    <button id="reload" title="रीलोड">&#8635;</button>
    <div id="addresswrap">
      <input id="address" type="text" spellcheck="false"
             placeholder="सर्च करें, पता लिखें, या हिंदी में कहें — जैसे: यूट्यूब खोलो" autocomplete="off" />
      <div id="suggest"></div>
    </div>
    <button id="mic" title="बोलकर चलाएँ — जैसे &quot;यूट्यूब खोलो&quot;, &quot;यह पेज पढ़कर सुनाओ&quot;">🎤</button>
    <button id="star" title="बुकमार्क (Ctrl+D)">☆</button>
    <button id="reader" title="रीडर मोड — सिर्फ़ आर्टिकल पढ़ें">📖</button>
    <button id="pip" title="पिक्चर-इन-पिक्चर — वीडियो छोटी विंडो में">🎦</button>
    <button id="keepalive" title="ऑटो-लॉगआउट रोकें: इस साइट को लॉग-इन बनाए रखें">📌</button>
    <button id="shield" title="ऐड-ब्लॉकर — क्लिक करके इस साइट पर बंद/चालू करें">🛡 <span id="blocked">0</span></button>
    <button id="downloads" title="डाउनलोड (Ctrl+J)">⬇</button>
    <button id="menu" title="मेन्यू">☰</button>
  </div>
  <div id="findbar">
    <input id="findtext" type="text" placeholder="पेज में खोजें…" />
    <span id="findcount"></span>
    <button id="findprev" title="पिछला">▲</button>
    <button id="findnext" title="अगला">▼</button>
    <button id="findclose" title="बंद करें">✕</button>
  </div>

  <div id="sidebar">
    <div id="sb-head">
      <div id="sb-title">📎 फ़ाइल अपलोड करें</div>
      <div id="sb-hint">फ़ोल्डर खोलें, फ़ाइल चुनें, फिर "अपलोड करें" दबाएँ</div>
    </div>
    <div id="sb-path">
      <button id="sb-up" title="पिछले फ़ोल्डर में जाएँ">↑</button>
      <span id="sb-cwd"></span>
      <button id="sb-star" title="इस फ़ोल्डर को फ़ेवरेट में जोड़ें/हटाएँ">☆</button>
    </div>
    <div id="sb-fav">
      <div class="lbl">⭐ फ़ेवरेट फ़ोल्डर</div>
      <div class="chiprow" id="sb-fav-row"></div>
    </div>
    <div id="sb-quick">
      <div class="lbl">तेज़ पहुँच</div>
      <div class="chiprow" id="sb-quick-row"></div>
    </div>
    <div id="sb-list"></div>
    <div id="sb-count"></div>
    <div id="sb-foot">
      <button id="sb-choose" disabled>अपलोड करें</button>
      <button id="sb-cancel">रद्द करें</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
