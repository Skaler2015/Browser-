<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <title>TezBrowser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #1b1d23;
      color: #e8eaf0;
      overflow: hidden;
      user-select: none;
    }

    /* ---- tab strip ---- */
    #tabstrip {
      display: flex;
      align-items: flex-end;
      height: 38px;
      padding: 6px 8px 0 8px;
      gap: 4px;
      background: #14161a;
      overflow-x: auto;
    }
    #tabstrip::-webkit-scrollbar { display: none; }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 120px;
      max-width: 220px;
      height: 32px;
      padding: 0 10px;
      background: #23262e;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      flex-shrink: 1;
      overflow: hidden;
    }
    .tab.active { background: #2f333d; }
    .tab .title {
      flex: 1;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab .close {
      width: 18px; height: 18px;
      line-height: 18px;
      text-align: center;
      border-radius: 50%;
      font-size: 12px;
      color: #9aa0ad;
      flex-shrink: 0;
    }
    .tab .close:hover { background: #4a4f5c; color: #fff; }
    .tab .spinner {
      width: 10px; height: 10px;
      border: 2px solid #4a4f5c;
      border-top-color: #6db3ff;
      border-radius: 50%;
      flex-shrink: 0;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #newtab {
      width: 28px; height: 28px;
      margin-bottom: 2px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #9aa0ad;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    #newtab:hover { background: #2f333d; color: #fff; }

    /* ---- navigation bar ---- */
    #navbar {
      display: flex;
      align-items: center;
      height: 46px;
      padding: 0 10px;
      gap: 6px;
      background: #2f333d;
    }
    #navbar button {
      width: 32px; height: 32px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #cfd3dc;
      font-size: 16px;
      cursor: pointer;
    }
    #navbar button:hover:not(:disabled) { background: #3d424e; }
    #navbar button:disabled { color: #5b6070; cursor: default; }
    #address {
      flex: 1;
      height: 32px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 16px;
      background: #1b1d23;
      color: #e8eaf0;
      font-size: 13px;
      outline: none;
      user-select: text;
    }
    #address:focus { border-color: #4d7fd6; }
    #shield {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 14px;
      background: #263524;
      color: #8fd694;
      font-size: 12px;
      white-space: nowrap;
      cursor: default;
    }
  </style>
</head>
<body>
  <div id="tabstrip"></div>
  <div id="navbar">
    <button id="back" title="पीछे">&#8592;</button>
    <button id="forward" title="आगे">&#8594;</button>
    <button id="reload" title="रीलोड">&#8635;</button>
    <input id="address" type="text" spellcheck="false"
           placeholder="सर्च करें या वेब एड्रेस लिखें…" />
    <div id="shield" title="इस टैब पर ब्लॉक किए गए ऐड/ट्रैकर">🛡 <span id="blocked">0</span></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
